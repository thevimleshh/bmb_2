# Spring Boot Application Configuration for BMB (Book My Bus)
spring.application.name=book-my-bus
server.port=8080

# MySQL Database Configuration (Configurable via Environment Variables for Cloud Deployments)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/bmb_bus_booking?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
jwt.secret=bmb_super_secret_jwt_key_2026_book_my_bus_secure_token_key_change_in_prod!
jwt.expiration-ms=86400000

# Razorpay Test Mode Credentials
# Replace with your test credentials from Razorpay Dashboard
razorpay.key.id=rzp_test_YourKeyIdHere
razorpay.key.secret=YourKeySecretHere

# Seat Hold Concurrency Setting (in minutes)
bmb.booking.seat-lock-duration-minutes=10
